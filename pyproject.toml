# SPDX-License-Identifier: MIT

[project]
name = "sciconvert"
dynamic = ["version"]
authors = [ {name = "Christofanis Skordas", email = "skordasc@uchicago.edu"} ]
maintainers = [ {name = "Christofanis Skordas", email = "skordasc@uchicago.edu"} ]
description = "SciConvert is a scientific data file format converter."
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
requires-python = "==3.14.*"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.5.5",
    "scipy>=1.18.1",
    "fabio>=2026.6.0",
    "wxutils>=2026.4.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
docs = [
    "myst-parser>=5.2.0",
    "pydata-sphinx-theme>=0.24.0",
    "sphinx>=9.2.0",
    "sphinx-autoapi>=3.9.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-design>=0.8.0",
]

[project.scripts]
sciconvert = "sciconvert:main"

[project.urls]
Homepage = "https://github.com/gsecars/sciconvert"
Issues = "https://github.com/gsecars/sciconvert/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.target.wheel]
packages = ["sciconvert"]
include = ["/sciconvert/assets/**"]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]
line-length = 160
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

